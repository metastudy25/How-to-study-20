<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20가지 핵심 학습법 — 미사이든학원</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f6f6f4;
    --text: #1a1a1a;
    --text-muted: #666;
    --border: rgba(0,0,0,0.1);
    --radius-md: 8px;
    --radius-lg: 12px;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg-secondary);
    color: var(--text);
    min-height: 100vh;
  }

  .page {
    max-width: 860px;
    margin: 0 auto;
    background: var(--bg);
    box-shadow: 0 0 60px rgba(0,0,0,0.08);
    min-height: 100vh;
  }

  /* HERO */
  .hero {
    background: #1a1a2e;
    padding: 4rem 3rem 3rem;
    position: relative;
    overflow: hidden;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -60px; right: -80px;
    width: 380px; height: 380px;
    border-radius: 50%;
    background: rgba(83,74,183,0.15);
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    bottom: -80px; left: 35%;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: rgba(29,158,117,0.10);
    pointer-events: none;
  }

  .hero-label {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #9F97EC;
    border: 1px solid rgba(159,151,236,0.4);
    padding: 5px 14px;
    border-radius: 2px;
    margin-bottom: 1.4rem;
    position: relative;
  }

  .hero-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 52px;
    font-weight: 700;
    color: #fff;
    line-height: 1.15;
    margin-bottom: 0.7rem;
    position: relative;
  }

  .hero-title span { color: #7F77DD; }

  .hero-tagline {
    font-size: 15px;
    color: rgba(255,255,255,0.45);
    font-weight: 300;
    margin-bottom: 2.2rem;
    position: relative;
  }

  .hero-provider {
    font-size: 12px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.06em;
    position: relative;
  }

  .hero-provider strong {
    color: rgba(255,255,255,0.6);
    font-weight: 500;
  }

  .divider {
    height: 4px;
    background: linear-gradient(90deg, #7F77DD 0%, #1D9E75 50%, transparent 100%);
  }

  /* INTRO */
  .intro {
    margin: 2.5rem 3rem;
    padding: 1.2rem 1.4rem;
    border-left: 3px solid #7F77DD;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.85;
  }

  /* SECTION */
  .section-head {
    padding: 2.5rem 3rem 1.2rem;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--text-muted);
    font-weight: 500;
    white-space: nowrap;
  }

  .section-line {
    flex: 1;
    height: 0.5px;
    background: var(--border);
  }

  /* CARDS GRID */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 1px;
    margin: 0 3rem;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--border);
  }

  .card {
    background: var(--bg);
    padding: 1.3rem 1.1rem 1.1rem;
    cursor: pointer;
    transition: background 0.15s;
  }

  .card:hover { background: var(--bg-secondary); }

  .card-num {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    margin-bottom: 0.5rem;
  }

  .card-icon {
    font-size: 24px;
    display: block;
    margin-bottom: 0.6rem;
  }

  .card-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    margin-bottom: 0.35rem;
    color: var(--text);
  }

  .card-sub {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 300;
    line-height: 1.4;
  }

  .card-tag {
    display: inline-block;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 2px;
    margin-top: 0.7rem;
    font-weight: 500;
  }

  /* Color classes */
  .c1 .card-num { color: #534AB7; }
  .c1 .card-tag { background: #EEEDFE; color: #534AB7; }
  .c2 .card-num { color: #0F6E56; }
  .c2 .card-tag { background: #E1F5EE; color: #0F6E56; }
  .c3 .card-num { color: #993C1D; }
  .c3 .card-tag { background: #FAECE7; color: #993C1D; }
  .c4 .card-num { color: #185FA5; }
  .c4 .card-tag { background: #E6F1FB; color: #185FA5; }
  .c5 .card-num { color: #3B6D11; }
  .c5 .card-tag { background: #EAF3DE; color: #3B6D11; }

  /* DETAIL PANEL */
  .detail-panel {
    display: none;
    margin: 1rem 3rem 0;
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border);
    background: var(--bg);
    padding: 1.6rem;
    animation: fadeIn 0.2s ease;
  }

  .detail-panel.visible { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .detail-inner {
    display: flex;
    gap: 1.5rem;
    align-items: flex-start;
  }

  .detail-icon-wrap {
    width: 52px; height: 52px;
    border-radius: var(--radius-md);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }

  .detail-content { flex: 1; }

  .detail-title {
    font-size: 17px;
    font-weight: 500;
    margin-bottom: 0.25rem;
    color: var(--text);
  }

  .detail-eng {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 0.9rem;
  }

  .detail-desc {
    font-size: 13px;
    line-height: 1.85;
    color: var(--text-muted);
  }

  .close-btn {
    display: inline-block;
    margin-top: 1.1rem;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    border: 0.5px solid var(--border);
    padding: 5px 14px;
    border-radius: var(--radius-md);
    user-select: none;
  }

  .close-btn:hover { background: var(--bg-secondary); }

  /* FOOTER */
  .mag-footer {
    margin: 3rem 3rem 0;
    padding: 1.8rem 0;
    border-top: 0.5px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-logo {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  .footer-note {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 300;
  }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    .hero { padding: 2.5rem 1.5rem 2rem; }
    .hero-title { font-size: 34px; }
    .intro { margin: 2rem 1.5rem; }
    .section-head { padding: 2rem 1.5rem 1rem; }
    .cards-grid { margin: 0 1.5rem; }
    .detail-panel { margin: 1rem 1.5rem 0; }
    .mag-footer { margin: 2rem 1.5rem 0; }
    .detail-inner { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <div class="hero-label">Special Edition</div>

    <div class="detail-inner">
      <div class="detail-icon-wrap" id="d3-bg"><span id="d3-icon"></span></div>
      <div class="detail-content">

  <div class="mag-footer">

const iconBgs = { c1:'#EEEDFE', c2:'#E1F5EE', c3:'#FAECE7', c4:'#E6F1FB', c5:'#EAF3DE' };

function buildGrid(gridId, items, group) {
  const grid = document.getElementById(gridId);
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = `card ${item.tagClass}`;
    card.innerHTML = `
      <div class="card-num">${item.num}</div>
      <span class="card-icon">${item.icon}</span>
      <div class="card-title">${item.title}</div>
      <div class="card-sub">${item.sub}</div>
      <span class="card-tag">${item.tag}</span>
    `;
    card.addEventListener('click', () => openDetail(group, item, item.tagClass));
    grid.appendChild(card);
  });
}

function openDetail(group, item, tagClass) {
  const panel = document.getElementById(`detail${group}`);
  document.getElementById(`d${group}-icon`).textContent = item.icon;
  document.getElementById(`d${group}-bg`).style.background = iconBgs[tagClass] || '#f0f0f0';
  document.getElementById(`d${group}-title`).textContent = item.title;
  document.getElementById(`d${group}-eng`).textContent = item.eng;
  document.getElementById(`d${group}-desc`).textContent = item.desc;
  panel.classList.add('visible');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeDetail(group) {
  document.getElementById(`detail${group}`).classList.remove('visible');
}

buildGrid('grid1', data.group1, 1);
buildGrid('grid2', data.group2, 2);
